<div class="page-header">
  <h1>{{ "tests.title" | t }}</h1>
  <button class="btn btn-primary" (click)="openNew()">
    <span class="nf nf-plus"></span> {{ "tests.new" | t }}
  </button>
</div>

<div *ngIf="showNew" class="card">
  <h2>{{ "tests.newTitle" | t }}</h2>
  <p class="muted">{{ "tests.desc" | t }}</p>
  <div *ngIf="error" class="alert alert-error">{{ error }}</div>
  <div class="field">
    <label>{{ "tests.topic" | t }}</label>
    <input [(ngModel)]="topic" [placeholder]="'tests.topicPlaceholder' | t" />
  </div>
  <div class="actions">
    <button class="btn btn-primary" (click)="generate()" [disabled]="generating">
      <span *ngIf="generating" class="spinner"></span>
      <span *ngIf="!generating" class="nf nf-flask"></span>
      {{ generating ? ("common.generating" | t) : ("tests.generate" | t) }}
    </button>
    <button class="btn" (click)="cancel()">{{ "common.cancel" | t }}</button>
  </div>
</div>

<div class="card list-card" *ngIf="!showNew && tests.length">
  <div class="test-row" *ngFor="let t of tests">
    <div class="test-row-main">
      <a [routerLink]="['/tests', t.id]" class="test-row-title">{{ t.title }}</a>
      <span class="muted test-row-sub">
        {{ t.jobOfferId == null ? ("tests.standalone" | t) : ("tests.fromOffer" | t) }}
        <ng-container *ngIf="t.createdAt"> · {{ t.createdAt }}</ng-container>
      </span>
    </div>
    <div class="test-row-actions">
      <a class="btn btn-sm btn-primary" [routerLink]="['/tests', t.id]">
        <span class="nf nf-clipboard"></span> {{ "tests.do" | t }}
      </a>
      <button class="btn btn-sm btn-ghost btn-icon" (click)="remove(t.id)" [title]="'common.delete' | t">
        <span class="nf nf-delete"></span>
      </button>
    </div>
  </div>
</div>

<p class="empty" *ngIf="!showNew && !tests.length">
  <span class="nf nf-book"></span>
  {{ "tests.empty" | t }}
</p>
